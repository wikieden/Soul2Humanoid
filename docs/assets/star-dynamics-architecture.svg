<?xml version="1.0" encoding="utf-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1008" height="720" viewBox="0 0 1008 720">
  <rect width="1008" height="720" fill="#0D1117"/>

  <text x="504" y="60" text-anchor="middle" font-size="22" font-weight="bold" fill="#E6EDF3" font-family="sans-serif">星动纪元 StarDynamics — ERA-42 VLA 系统架构</text>
  <text x="504" y="85" text-anchor="middle" font-size="14" fill="#8B949E" font-family="sans-serif" font-style="italic">端到端 VLA 具身大模型 + 分频架构 + 世界模型融合</text>

  <!-- Top: Perception -->
  <rect x="70" y="125" width="200" height="90" rx="8" fill="#E65100" stroke="#30363D" stroke-width="2"/>
  <text x="170" y="163" text-anchor="middle" font-size="12" font-weight="bold" fill="white" font-family="sans-serif">环境感知</text>
  <text x="170" y="183" text-anchor="middle" font-size="10" fill="white" font-family="sans-serif">双目相机  |  3D 激光雷达</text>
  <text x="170" y="200" text-anchor="middle" font-size="10" fill="white" font-family="sans-serif">麦克风阵列 | IMU</text>

  <rect x="310" y="125" width="200" height="90" rx="8" fill="#1565C0" stroke="#30363D" stroke-width="2"/>
  <text x="410" y="163" text-anchor="middle" font-size="12" font-weight="bold" fill="white" font-family="sans-serif">任务理解</text>
  <text x="410" y="183" text-anchor="middle" font-size="10" fill="white" font-family="sans-serif">自然语言指令解析</text>
  <text x="410" y="200" text-anchor="middle" font-size="10" fill="white" font-family="sans-serif">场景语义理解</text>

  <rect x="550" y="125" width="200" height="90" rx="8" fill="#6A1B9A" stroke="#30363D" stroke-width="2"/>
  <text x="650" y="163" text-anchor="middle" font-size="12" font-weight="bold" fill="white" font-family="sans-serif">本体感知</text>
  <text x="650" y="183" text-anchor="middle" font-size="10" fill="white" font-family="sans-serif">全身关节编码器</text>
  <text x="650" y="200" text-anchor="middle" font-size="10" fill="white" font-family="sans-serif">力/力矩传感</text>

  <rect x="790" y="125" width="150" height="90" rx="8" fill="#00ACC1" stroke="#30363D" stroke-width="2"/>
  <text x="865" y="163" text-anchor="middle" font-size="12" font-weight="bold" fill="white" font-family="sans-serif">80+275 TOPS</text>
  <text x="865" y="183" text-anchor="middle" font-size="10" fill="white" font-family="sans-serif">X86 + Orin</text>
  <text x="865" y="200" text-anchor="middle" font-size="10" fill="white" font-family="sans-serif">边缘推理</text>

  <!-- Down arrows -->
  <line x1="170" y1="215" x2="170" y2="260" stroke="#8B949E" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="410" y1="215" x2="410" y2="260" stroke="#8B949E" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="650" y1="215" x2="650" y2="260" stroke="#8B949E" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="865" y1="215" x2="865" y2="260" stroke="#8B949E" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ERA-42 Core -->
  <rect x="155" y="265" width="690" height="120" rx="12" fill="#4A148C" stroke="#30363D" stroke-width="2.5"/>
  <text x="500" y="305" text-anchor="middle" font-size="16" font-weight="bold" fill="white" font-family="sans-serif">ERA-42 端到端 VLA 具身大模型</text>
  <text x="500" y="333" text-anchor="middle" font-size="12" fill="white" font-family="sans-serif">国内首个融合世界模型 + 快慢分层架构的具身大脑</text>

  <!-- Fast/Slow System -->
  <rect x="180" y="345" width="200" height="30" rx="6" fill="#FF6F00" stroke="#30363D" stroke-width="1"/>
  <text x="280" y="365" text-anchor="middle" font-size="11" font-weight="bold" fill="white" font-family="sans-serif">分频快系统（高频控制）</text>

  <rect x="410" y="345" width="200" height="30" rx="6" fill="#00838F" stroke="#30363D" stroke-width="1"/>
  <text x="510" y="365" text-anchor="middle" font-size="11" font-weight="bold" fill="white" font-family="sans-serif">分频慢系统（任务规划）</text>

  <rect x="640" y="345" width="180" height="30" rx="6" fill="#2E7D32" stroke="#30363D" stroke-width="1"/>
  <text x="730" y="365" text-anchor="middle" font-size="11" font-weight="bold" fill="white" font-family="sans-serif">世界模型（预测）</text>

  <!-- Down arrow -->
  <line x1="500" y1="385" x2="500" y2="425" stroke="#8B949E" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Output / Control Layer -->
  <rect x="70" y="430" width="870" height="90" rx="10" fill="#004D40" stroke="#30363D" stroke-width="2.5"/>
  <text x="505" y="465" text-anchor="middle" font-size="15" font-weight="bold" fill="white" font-family="sans-serif">全身协同控制</text>
  <text x="505" y="490" text-anchor="middle" font-size="11" fill="white" font-family="sans-serif">55 DoF 同步控制  |  全身运动规划  |  五指灵巧手精细操作  |  动态平衡维护</text>
  <text x="505" y="510" text-anchor="middle" font-size="10" fill="white" font-family="sans-serif">4 m/s 奔跑  |  20 kg 双臂负载  |  400 N·m 膝关节峰值扭矩</text>

  <!-- Down arrow -->
  <line x1="500" y1="520" x2="500" y2="555" stroke="#8B949E" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Products -->
  <rect x="155" y="560" width="320" height="80" rx="8" fill="#161B22" stroke="#E65100" stroke-width="2"/>
  <text x="315" y="590" text-anchor="middle" font-size="13" font-weight="bold" fill="#E65100" font-family="sans-serif">星动 L7（旗舰）</text>
  <text x="315" y="610" text-anchor="middle" font-size="10" fill="#8B949E" font-family="sans-serif">1.71m / 65kg  |  55 DoF  |  50% 海外占比</text>
  <text x="315" y="628" text-anchor="middle" font-size="10" fill="#8B949E" font-family="sans-serif">全尺寸双足人形  |  物流场景百台部署</text>

  <rect x="520" y="560" width="320" height="80" rx="8" fill="#161B22" stroke="#6A1B9A" stroke-width="2"/>
  <text x="680" y="590" text-anchor="middle" font-size="13" font-weight="bold" fill="#CE93D8" font-family="sans-serif">XHAND 1 灵巧手</text>
  <text x="680" y="610" text-anchor="middle" font-size="10" fill="#8B949E" font-family="sans-serif">全直驱仿人五指  |  12 主动 DoF</text>
  <text x="680" y="628" text-anchor="middle" font-size="10" fill="#8B949E" font-family="sans-serif">80N 抓握力  |  25kg 提重</text>

  <!-- Bottom note -->
  <text x="504" y="700" text-anchor="middle" font-size="10" fill="#8B949E" font-family="sans-serif" font-style="italic">清华大学唯一持股人形机器人企业  |  2025 年商业化订单超 5 亿  |  2026 A+ 轮 10 亿元（吉利资本领投）</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8B949E"/>
    </marker>
  </defs>
</svg>
