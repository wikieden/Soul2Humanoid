<?xml version="1.0" encoding="utf-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1008pt" height="720pt" viewBox="0 0 1008 720">
  <rect width="1008" height="720" fill="#0D1117"/>
  
  <!-- Title -->
  <text x="504" y="60" text-anchor="middle" font-size="22" font-weight="bold" fill="#E6EDF3" font-family="sans-serif">Weave Robotics Isaac 1 — System Architecture</text>
  <text x="504" y="85" text-anchor="middle" font-size="14" fill="#8B949E" font-family="sans-serif" font-style="italic">Wheeled Home Robot with Teleoperation-Assisted Autonomy</text>

  <!-- Sensor Row -->
  <!-- Cameras -->
  <rect x="90" y="130" width="180" height="90" rx="8" fill="#00897B" stroke="#30363D" stroke-width="2"/>
  <text x="180" y="168" text-anchor="middle" font-size="12" font-weight="bold" fill="white" font-family="sans-serif">Head Cameras</text>
  <text x="180" y="185" text-anchor="middle" font-size="10" fill="white" font-family="sans-serif">Physical Privacy Shutters</text>

  <!-- Proprioception -->
  <rect x="310" y="130" width="180" height="90" rx="8" fill="#0097A7" stroke="#30363D" stroke-width="2"/>
  <text x="400" y="168" text-anchor="middle" font-size="12" font-weight="bold" fill="white" font-family="sans-serif">Proprioception</text>
  <text x="400" y="185" text-anchor="middle" font-size="10" fill="white" font-family="sans-serif">Joint State + Force Sensors</text>

  <!-- Wi-Fi -->
  <rect x="530" y="130" width="180" height="90" rx="8" fill="#00ACC1" stroke="#30363D" stroke-width="2"/>
  <text x="620" y="168" text-anchor="middle" font-size="12" font-weight="bold" fill="white" font-family="sans-serif">Wi-Fi Connectivity</text>
  <text x="620" y="185" text-anchor="middle" font-size="10" fill="white" font-family="sans-serif">Smartphone Companion App</text>

  <!-- User Scheduling -->
  <rect x="750" y="130" width="180" height="90" rx="8" fill="#26A69A" stroke="#30363D" stroke-width="2"/>
  <text x="840" y="168" text-anchor="middle" font-size="12" font-weight="bold" fill="white" font-family="sans-serif">User Scheduling</text>
  <text x="840" y="185" text-anchor="middle" font-size="10" fill="white" font-family="sans-serif">On-Demand / Timed Tasks</text>

  <!-- Arrows from sensors to core -->
  <line x1="180" y1="220" x2="220" y2="285" stroke="#8B949E" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="220" x2="400" y2="285" stroke="#8B949E" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="620" y1="220" x2="620" y2="285" stroke="#8B949E" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="840" y1="220" x2="800" y2="285" stroke="#8B949E" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Left: Teleoperation -->
  <rect x="20" y="290" width="140" height="120" rx="8" fill="#00695C" stroke="#30363D" stroke-width="2"/>
  <text x="90" y="330" text-anchor="middle" font-size="11" font-weight="bold" fill="white" font-family="sans-serif">Remote Human</text>
  <text x="90" y="350" text-anchor="middle" font-size="11" font-weight="bold" fill="white" font-family="sans-serif">Operator</text>
  <text x="90" y="380" text-anchor="middle" font-size="9" fill="white" font-family="sans-serif">Teleoperation</text>
  <text x="90" y="395" text-anchor="middle" font-size="9" fill="white" font-family="sans-serif">Assistance</text>
  <!-- bidir arrow -->
  <line x1="160" y1="350" x2="195" y2="350" stroke="#8B949E" stroke-width="2"/>
  <polygon points="160,344 160,356 152,350" fill="#8B949E"/>
  <polygon points="195,344 195,356 203,350" fill="#8B949E"/>

  <!-- Right: Companion App -->
  <rect x="860" y="290" width="140" height="120" rx="8" fill="#00796B" stroke="#30363D" stroke-width="2"/>
  <text x="930" y="330" text-anchor="middle" font-size="11" font-weight="bold" fill="white" font-family="sans-serif">Smartphone</text>
  <text x="930" y="350" text-anchor="middle" font-size="11" font-weight="bold" fill="white" font-family="sans-serif">Companion App</text>
  <text x="930" y="380" text-anchor="middle" font-size="9" fill="white" font-family="sans-serif">Schedule &amp;</text>
  <text x="930" y="395" text-anchor="middle" font-size="9" fill="white" font-family="sans-serif">Monitor</text>
  <!-- bidir arrow -->
  <line x1="860" y1="350" x2="820" y2="350" stroke="#8B949E" stroke-width="2"/>
  <polygon points="860,344 860,356 868,350" fill="#8B949E"/>
  <polygon points="820,344 820,356 812,350" fill="#8B949E"/>

  <!-- Core Autonomy Box -->
  <rect x="180" y="285" width="640" height="130" rx="12" fill="#4DB6AC" stroke="#30363D" stroke-width="2.5"/>
  <text x="500" y="330" text-anchor="middle" font-size="16" font-weight="bold" fill="white" font-family="sans-serif">Autonomy Stack + Teleoperation Framework</text>
  <text x="500" y="362" text-anchor="middle" font-size="11" fill="white" font-family="sans-serif">Autonomous Navigation  |  Task Planning  |  Motion Execution  |  Teleoperation Fallback</text>

  <!-- Arrow from core to hardware -->
  <line x1="500" y1="415" x2="500" y2="465" stroke="#8B949E" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Hardware Platform -->
  <rect x="30" y="470" width="960" height="130" rx="10" fill="#004D40" stroke="#30363D" stroke-width="2.5"/>
  <text x="510" y="505" text-anchor="middle" font-size="15" font-weight="bold" fill="white" font-family="sans-serif">Hardware Platform — Full-Stack Custom Design</text>
  <text x="510" y="530" text-anchor="middle" font-size="10" fill="white" font-family="sans-serif">Wheeled Base (Passively Stable)  |  21 DoF Total (2 Neck + 2×6 Arms + 2×1 Hands + 2 Torso + 3 Base)</text>
  <text x="510" y="548" text-anchor="middle" font-size="10" fill="white" font-family="sans-serif">Telescoping Torso 3' - 5'9"  |  80" Vertical + 38" Horizontal Reach  |  Custom Actuators + Remote Actuation</text>
  <text x="510" y="566" text-anchor="middle" font-size="10" fill="white" font-family="sans-serif">Swappable Fabric Shells for Safety  |  20.5" × 22" Footprint</text>
  <text x="510" y="588" text-anchor="middle" font-size="10" fill="white" font-family="sans-serif">8h Battery / 2h Charge  |  Assembled in San Francisco</text>

  <!-- Task boxes -->
  <rect x="60" y="620" width="420" height="85" rx="8" fill="#161B22" stroke="#4DB6AC" stroke-width="2"/>
  <text x="270" y="652" text-anchor="middle" font-size="13" font-weight="bold" fill="#4DB6AC" font-family="sans-serif">Laundry Flow</text>
  <text x="270" y="676" text-anchor="middle" font-size="10" fill="#8B949E" font-family="sans-serif">Find Dirty Clothes → Handle Hampers → Fold → Put Away</text>

  <rect x="540" y="620" width="420" height="85" rx="8" fill="#161B22" stroke="#4DB6AC" stroke-width="2"/>
  <text x="750" y="652" text-anchor="middle" font-size="13" font-weight="bold" fill="#4DB6AC" font-family="sans-serif">Daily Reset</text>
  <text x="750" y="676" text-anchor="middle" font-size="10" fill="#8B949E" font-family="sans-serif">Make Beds → Fix Pillows/Blankets → Tidy Toys/Shoes/Clutter</text>

  <!-- Pricing line -->
  <text x="504" y="715" text-anchor="middle" font-size="10" fill="#8B949E" font-family="sans-serif" font-style="italic">Price: $7,999 Upfront or $449/mo Subscription  |  Delivery: Fall 2026 (CA first, US 2027)</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8B949E"/>
    </marker>
  </defs>
</svg>
