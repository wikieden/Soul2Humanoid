site_name: Soul2Humanoid — 具身大脑技术方案调研
site_description: 系统性调研全球主流机器人公司（Figure AI、Physical Intelligence、Tesla Optimus、Boston Dynamics、Unitree、1X 等）的具身智能（Embodied AI）技术路线，聚焦 VLA 端到端、Flow Matching、数据飞轮等核心算法架构。
site_url: https://wikieden.github.io/Soul2Humanoid/
repo_url: https://github.com/wikieden/Soul2Humanoid
repo_name: Soul2Humanoid
edit_uri: edit/main/docs/
theme:
  name: material
  language: zh
  palette:
  - scheme: default
    primary: deep orange
    accent: orange
    toggle:
      icon: material/brightness-7
      name: 切换到深色模式
  - scheme: slate
    primary: deep orange
    accent: orange
    toggle:
      icon: material/brightness-4
      name: 切换到浅色模式
  font:
    text: Noto Sans SC
    code: JetBrains Mono
  features:
  - navigation.instant
  - navigation.tracking
  - navigation.tabs
  - navigation.sections
  - navigation.expand
  - navigation.indexes
  - navigation.top
  - search.suggest
  - search.highlight
  - search.share
  - content.code.copy
  - content.tabs.link
  - toc.follow
  icon:
    repo: fontawesome/brands/github
  favicon: assets/favicon.png
extra:
  social:
  - icon: fontawesome/brands/github
    link: https://github.com/wikieden/Soul2Humanoid
  generator: false
copyright: >
  &copy; 2024–2026 Soul2Humanoid ·
  <a href="https://github.com/wikieden/Soul2Humanoid">GitHub</a> ·
  <a href="https://wikieden.github.io/Soul2Humanoid/feed.xml">RSS 订阅</a>
extra_css:
- stylesheets/extra.css
plugins:
- search
- minify:
    minify_html: true
    minify_js: true
    minify_css: true
    html_minify:
      remove_comments: true
- rss:
    feed_size: 25
    feed_ttl: 60
    pretty_print: false
    collections:
      - index
      - latest-news
      - papers
markdown_extensions:
- admonition
- attr_list
- def_list
- footnotes
- md_in_html
- toc:
    permalink: true
- pymdownx.betterem
- pymdownx.caret
- pymdownx.details
- pymdownx.highlight:
    anchor_linenums: true
- pymdownx.inlinehilite
- pymdownx.keys
- pymdownx.mark
- pymdownx.smartsymbols
- pymdownx.superfences
- pymdownx.tabbed:
    alternate_style: true
- pymdownx.tasklist:
    custom_checkbox: true
- pymdownx.tilde
nav:
- 首页: index.md
- 公司调研:
  - Figure AI: reports/figure-ai.md
  - Physical Intelligence: reports/physical-intelligence.md
  - Tesla Optimus: reports/tesla-optimus.md
  - Boston Dynamics: reports/boston-dynamics.md
  - 1X Technologies: reports/1x-technologies.md
  - Unitree 宇树科技: reports/unitree.md
  - Google DeepMind: reports/google-deepmind.md
  - Agility Robotics: reports/agility-robotics.md
  - Apptronik: reports/apptronik.md
  - NVIDIA Isaac: reports/nvidia-isaac.md
  - Enchanted Tools: reports/enchanted-tools.md
  - Genesis AI: reports/genesis-ai.md
- 横向分析:
  - 对比分析: comparisons.md
  - 最新动态: latest-news.md
  - 论文索引: papers.md
  - 投资追踪: funding.md
- 深度调研:
  - VLA 模型全景: vla-models.md
  - 灵巧手 × Ego 数据: dexterous-hand-ego-data.md
  - 数据采集方法对比: data-collection-methods.md
  - 数据采集实战指南: data-collection-playbook.md
  - 场景感知技术: scene-perception.md
  - 大空间物体重定位: large-space-object-relocalization.md
- 资源索引:
  - 技术标签: tags.md
  - 开源资源: resources.md
  - 开源追踪: open-source-tracking.md
  - 中文媒体: podcasts-videos.md
  - 关键人物: people.md
